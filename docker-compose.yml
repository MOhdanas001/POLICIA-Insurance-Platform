version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: policy_claims_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:-23#A#khan}
      POSTGRES_DB: policy_claims_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policy_claims_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${PGPASSWORD:-23#A#khan}@postgres:5432/policy_claims_db
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-23#A#khan}
      PGDATABASE: policy_claims_db
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_policy_claims_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_key_policy_claims_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    container_name: policy_claims_frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  postgres_data:
